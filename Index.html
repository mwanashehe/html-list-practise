<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Lists</title>
  </head>
  <body>
    <h2>Unordered</h2>
    <ul style="list-style-type: square">
      <li>Teacher</li>
      <li>Student</li>
    </ul>
    <h2>Ordered</h2>
    <ol type="A">
      <li>Plan</li>
      <li>Build</li>
      <li>Launch</li>
    </ol>
    <h2>Mixed nested</h2>
    <ol>
      <li>
        Jobs
        <ul style="list-style-type: disc">
          <li>Teacher</li>
          <li>Editing</li>
        </ul>
      </li>
      <li>
        Software
        <ul style="list-style-type: disc">
          <li>VS Code</li>
          <li>Da Vinci Resolve</li>
        </ul>
      </li>
    </ol>
  </body>
</html>
